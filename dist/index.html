<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Redirecting…</title><meta http-equiv="refresh" content="0; url=./en/"/></head><body><script>(function(){try{var supported=["en","es","fr","de","ar","zh","ru","pt","hi","ja"];var nav=(navigator.languages&&navigator.languages[0])||navigator.language||'en';var short=(nav||'en').slice(0,2).toLowerCase();var target=supported.includes(short)?short:'en';location.replace('./'+target+'/');}catch(e){location.replace('./en/');}})();</script></body></html>
